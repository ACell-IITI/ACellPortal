<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IIT Indore Memory Map</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#d6eadb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:1964px;height:1130px;transform-origin:0 0}
#world>svg,#sat{position:absolute;left:0;top:0}
#sat{width:1964px;height:962px;display:none;user-select:none;-webkit-user-drag:none}
body.sat #sat{display:block}body.sat #mapl{display:none}
.b{position:absolute;transform:translate(-50%,-50%);color:#fff;font-weight:700;padding:0 4px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;border-radius:4px;box-shadow:0 6px 12px rgba(0,0,0,.28);cursor:pointer;user-select:none;transition:transform .12s}
.b:hover{transform:translate(-50%,-50%) scale(1.1);z-index:5}
.b i{position:absolute;top:-8px;right:-8px;background:#fff;color:#222;font-style:normal;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.b.ph{padding:3px 3px 15px;background-color:transparent;box-shadow:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));background-repeat:no-repeat;background-position:center;background-size:contain;background-origin:content-box;color:#fff}.b .lbl{position:absolute;left:-14px;right:-14px;bottom:1px;text-align:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000,0 0 5px #000;white-space:nowrap}
body.edit .b{outline:2px dashed #ffd400;cursor:move}
.hostel{background:#c2185b}.pod{background:#e65100}.food{background:#00695c}.lab{background:#4527a0}.acad{background:#1565c0}.hall{background:#37474f}.health{background:#c62828}.sport{background:#2e7d32}.other{background:#6d4c41}
#title{position:absolute;left:0;top:calc(env(safe-area-inset-top,0px) + 18px);background:#fff;padding:12px 20px;border-radius:0 18px 18px 0;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:10}
#title h1{margin:0;font-size:19px;color:#1b1b1b}#title p{margin:3px 0 0;font-size:12px;color:#555}
#bar{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 18px);z-index:10;display:flex;gap:8px}
#bar button,#zoom button{border:0;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;font-size:13px;padding:0 12px;height:36px}
#zoom{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;font-size:20px;padding:0}
#out{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;width:270px;height:110px;display:none;font:11px monospace}
body.edit #out{display:block}
#legend{position:absolute;left:1030px;top:984px;width:900px;box-sizing:border-box;background:#fffffff2;padding:10px 14px;border-radius:12px;font-size:13px;color:#222;box-shadow:0 4px 14px rgba(0,0,0,.3)}#legend b{display:block;margin-bottom:6px;font-size:13px}#legend .cats,#legend .lines{display:flex;gap:6px 14px;flex-wrap:wrap}#legend .lines{margin-top:7px;padding-top:7px;border-top:1px solid #ddd;color:#444}#legend .lines span:before{display:none}#legend .lines svg{vertical-align:middle;margin-right:5px}#legend small{display:block;margin-top:6px;color:#666;font-size:11px}
#legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#card{background:#fff;color:#1b1b1b;border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px}
#card h2{margin:0 0 2px}#card .cat{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.06em}
#gal{margin:12px 0;border-radius:10px;background:#f1f1f1;min-height:160px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#777;font-size:14px}
#gal img{width:100%;display:block;background:#fff}
#cap{font-size:14px;margin:0 0 10px;color:#333;white-space:pre-line}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button,.row label{padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer;font-size:14px}
.row .pri{background:#1565c0;color:#fff;border-color:#1565c0}

.b u{position:absolute;top:-8px;left:-8px;background:#ffd400;color:#222;text-decoration:none;font-size:11px;font-weight:700;width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.45)}
body.exp #bar,body.exp #zoom{display:none}
</style></head><body>

const apply=()=>world.style.transform=`translate(${X}px,${Y}px) scale(${S})`;
function fit(){S=Math.max(.25,Math.min(innerWidth/1964,innerHeight/1130));if(innerWidth<700)S=Math.max(S,.5);X=(innerWidth-1964*S)/2;Y=(innerHeight-1130*S)/2;if(innerWidth<700){X=0;Y=0}apply()}
function zoomAt(f,cx,cy){const n=Math.min(4,Math.max(.2,S*f));X=cx-(cx-X)*(n/S);Y=cy-(cy-Y)*(n/S);S=n;apply()}
fit();addEventListener('resize',fit);
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
vp.addEventListener('pointerdown',e=>{moved=0;const t=e.target.closest('.b');
 if(edit&&t){const b=B.find(q=>q.id===t.dataset.id);drag={t,b,x:e.clientX,y:e.clientY,ox:b.x,oy:b.y}}
 else drag={x:e.clientX,y:e.clientY,X,Y}});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(Math.abs(dx)+Math.abs(dy)>4)moved=1;if(!moved)return;
 if(drag.b){drag.b.x=drag.ox+Math.round(dx/S);drag.b.y=drag.oy+Math.round(dy/S);drag.t.style.left=drag.b.x+'px';drag.t.style.top=drag.b.y+'px';spurs()}
 else{vp.classList.add('drag');X=drag.X+dx;Y=drag.Y+dy;apply()}});
addEventListener('pointerup',e=>{const d=drag;drag=null;vp.classList.remove('drag');
 if(d&&d.b&&moved){out.value=JSON.stringify(B.map(b=>({id:b.id,x:b.x,y:b.y})));return}
 if(!moved&&!edit){const t=e.target.closest('.b');if(t)open(t.dataset.id)}});
zi.onclick=()=>zoomAt(1.3,innerWidth/2,innerHeight/2);zo.onclick=()=>zoomAt(.77,innerWidth/2,innerHeight/2);zr.onclick=fit;
vw.onclick=()=>{const s=document.body.classList.toggle('sat');vw.textContent=s?'🗺️ Map':'🛰️ Satellite'};
ed.onclick=()=>{edit=!edit;document.body.classList.toggle('edit',edit);ed.textContent=edit?'✅ Done editing':'✏️ Edit positions';out.value=JSON.stringify(B.map(b=>({id:b.id,x:b.x,y:b.y})))};
let cur=null,idx=0;
function show(){const b=B.find(x=>x.id===cur),l=imgs(cur);
 mc.textContent=CATS[b.c];mt.textContent=b.n;
 gal.innerHTML=l.length?`<img src="${l[idx].src}" alt="${b.n}">`:'No photos yet — memories coming soon.';
 cap.textContent=(l.length?(l[idx].cap||''):(DESC[cur]||''))+(b.apx?'\n≈ Approximate position: '+b.apx:'');
 pv.style.display=nx.style.display=l.length>1?'':'none'}
function open(id){cur=id;idx=0;show();modal.classList.add('on')}
pv.onclick=()=>{const n=imgs(cur).length;idx=(idx-1+n)%n;show()};
nx.onclick=()=>{idx=(idx+1)%imgs(cur).length;show()};
cl.onclick=()=>modal.classList.remove('on');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};
up.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{(loc[cur]=loc[cur]||[]).push({src:r.result,cap:f.name});idx=imgs(cur).length-1;show();render()};r.readAsDataURL(f);up.value=''};
</script></body></html>
