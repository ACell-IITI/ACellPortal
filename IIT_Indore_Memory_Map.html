<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IIT Indore Memory Map</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#d6eadb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:1964px;height:1288px;transform-origin:0 0}
#world>svg,#sat{position:absolute;left:0;top:0}
#sat{width:1964px;height:1120px;display:none;user-select:none;-webkit-user-drag:none}
body.sat #sat{display:block}body.sat #mapl{display:none}
.b{position:absolute;transform:translate(-50%,-50%);color:#fff;font-weight:700;padding:0 4px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;border-radius:4px;box-shadow:0 6px 12px rgba(0,0,0,.28);cursor:pointer;user-select:none;transition:transform .12s}
.b:hover{transform:translate(-50%,-50%) scale(1.1);z-index:5}
.b i{position:absolute;top:-8px;right:-8px;background:#fff;color:#222;font-style:normal;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.b.ph{padding:3px 3px 15px;background-color:transparent;box-shadow:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));background-repeat:no-repeat;background-position:center;background-size:contain;background-origin:content-box;color:#fff}.b .lbl{position:absolute;left:-14px;right:-14px;bottom:1px;text-align:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000,0 0 5px #000;white-space:nowrap}
body.edit .b{outline:2px dashed #ffd400;cursor:move}
.hostel{background:#c2185b}.pod{background:#e65100}.food{background:#00695c}.lab{background:#4527a0}.acad{background:#1565c0}.hall{background:#37474f}.health{background:#c62828}.sport{background:#2e7d32}.other{background:#6d4c41}
#title{position:absolute;left:0;top:calc(env(safe-area-inset-top,0px) + 18px);background:#fff;padding:12px 20px;border-radius:0 18px 18px 0;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:10}
#title h1{margin:0;font-size:19px;color:#1b1b1b}#title p{margin:3px 0 0;font-size:12px;color:#555}
#bar{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 18px);z-index:10;display:flex;gap:8px}
#bar button,#zoom button{border:0;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;font-size:13px;padding:0 12px;height:36px}
#zoom{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;font-size:20px;padding:0}
#out{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;width:270px;height:110px;display:none;font:11px monospace}
body.edit #out{display:block}
#legend{position:absolute;left:1478px;top:986px;width:462px;box-sizing:border-box;background:#fffffff2;padding:10px 14px;border-radius:12px;font-size:13px;color:#222;box-shadow:0 4px 14px rgba(0,0,0,.3)}#legend b{display:block;margin-bottom:6px;font-size:13px}#legend .cats,#legend .lines{display:flex;gap:6px 14px;flex-wrap:wrap}#legend .lines{margin-top:7px;padding-top:7px;border-top:1px solid #ddd;color:#444}#legend .lines span:before{display:none}#legend .lines svg{vertical-align:middle;margin-right:5px}#legend small{display:block;margin-top:6px;color:#666;font-size:11px}
#legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#card{background:#fff;color:#1b1b1b;border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px}
#card h2{margin:0 0 2px}#card .cat{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.06em}
#gal{margin:12px 0;border-radius:10px;background:#f1f1f1;min-height:160px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#777;font-size:14px}
#gal img{width:100%;display:block;background:#fff}
#cap{font-size:14px;margin:0 0 10px;color:#333;white-space:pre-line}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button,.row label{padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer;font-size:14px}
.row .pri{background:#1565c0;color:#fff;border-color:#1565c0}

.b u{position:absolute;top:-8px;left:-8px;background:#ffd400;color:#222;text-decoration:none;font-size:11px;font-weight:700;width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.45)}
#trayg,.b.tray{display:none}body.edit #trayg{display:inline}body.edit .b.tray{display:flex}#out{right:12px;top:12px}
@media(max-width:700px){#title{padding:8px 14px;max-width:calc(100vw - 150px)}#title h1{font-size:15px}#title p{display:none}#bar{flex-direction:column;gap:6px}#bar button{height:32px;font-size:12px}}
</style></head><body>

// ---- roads: drawn from data so junctions are shared vertices ----
(function(){const g=document.getElementById('roadsg');
  const SH='#cdd1d4',AS='#72787e',WH='#f2f2f2';
  const mk=(t,a,par)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(par||g).appendChild(e);return e};
  // layers drawn for ALL roads / lanes / entrance paths / roundabout together so every joint merges: shoulder > outer asphalt > thin white edge line > inner asphalt
  const LAY=[[SH,12,7.8,7.4],[AS,10.6,6.6,6.2],[WH,9.2,5.8,5.4],[AS,8.2,5,4.6]];
  const D=cls=>ROADS.filter(r=>r[0]===cls).map(r=>'M'+r[1].map(p=>p[0]+' '+p[1]).join('L')).join('');
  window.SPP=[];
  const spurGroup=(par,a)=>{const gg=mk('g',{transform:'scale('+(1/K)+')'},par);window.SPP.push(mk('path',a,gg));return gg};
  LAY.forEach(([c,m,l,s])=>{const lg=mk('g',{});
    mk('path',{d:D('lane'),stroke:c,'stroke-width':l},lg);mk('path',{d:D('main'),stroke:c,'stroke-width':m},lg);
    mk('circle',{cx:904,cy:112,r:9,stroke:c,'stroke-width':m},lg);
    spurGroup(lg,{stroke:c,'stroke-width':s})});
  // joint patches: open the edge lines of the main road wherever another road / path joins it
  const RC=[904,112],near=(pt,skip)=>{if(Math.abs(Math.hypot(pt[0]-RC[0],pt[1]-RC[1])-9)<2)return true;
    for(let j=0;j<ROADS.length;j++){if(j===skip)continue;const q=ROADS[j][1];for(let i=0;i<q.length-1;i++){const ax=q[i][0],ay=q[i][1],dx=q[i+1][0]-ax,dy=q[i+1][1]-ay,Ls=dx*dx+dy*dy;
      let t=Ls?((pt[0]-ax)*dx+(pt[1]-ay)*dy)/Ls:0;t=Math.max(0,Math.min(1,t));if(Math.hypot(pt[0]-ax-t*dx,pt[1]-ay-t*dy)<0.9)return true}}return false};
  let patch='',dl='',dm='';
  const mkd=(pts,j,a,b)=>{ // dash path with joined ends pulled back
    const q=pts.map(p=>p.slice());const cut=(i0,i1)=>{const dx=q[i1][0]-q[i0][0],dy=q[i1][1]-q[i0][1],l=Math.hypot(dx,dy);if(l>9){q[i0][0]+=dx/l*5;q[i0][1]+=dy/l*5}};
    if(a)cut(0,1);if(b)cut(q.length-1,q.length-2);return 'M'+q.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L')};
  const pg={lane:'',main:''};
  ROADS.forEach((r,j)=>{const pts=r[1],cls=r[0],n=pts.length;const ends=[[0,1,pts[0]],[n-1,n-2,pts[n-1]]];const joined=ends.map(e=>near(e[2],j));
    ends.forEach((e,k)=>{if(!joined[k])return;const a=pts[e[0]],b=pts[e[1]],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,len=Math.min(6.8,l);
      pg[cls]+='M'+a[0]+' '+a[1]+'L'+(a[0]+dx/l*len).toFixed(2)+' '+(a[1]+dy/l*len).toFixed(2)});
    (cls==='lane'?dl+=mkd(pts,j,joined[0],joined[1]):dm+=mkd(pts,j,joined[0],joined[1]))});
  const pa=mk('g',{});
  mk('path',{d:pg.lane,stroke:AS,'stroke-width':6,'stroke-linecap':'butt'},pa);mk('path',{d:pg.main,stroke:AS,'stroke-width':9.5,'stroke-linecap':'butt'},pa);
  spurGroup(pa,{stroke:AS,'stroke-width':5.6,'stroke-linecap':'butt'});
  const da=mk('g',{});
  mk('path',{d:dl,stroke:WH,'stroke-width':.7,'stroke-dasharray':'7 15','stroke-linecap':'butt','stroke-linejoin':'round'},da);
  mk('path',{d:dm,stroke:WH,'stroke-width':.95,'stroke-dasharray':'10 18','stroke-linecap':'butt','stroke-linejoin':'round'},da);
  mk('circle',{cx:904,cy:112,r:9,stroke:WH,'stroke-width':.9,'stroke-dasharray':'7 15'},da);
  spurGroup(da,{stroke:WH,'stroke-width':1.1,'stroke-dasharray':'7 15','stroke-linecap':'butt'});
  mk('circle',{cx:904,cy:112,r:4.6,fill:'#8fcb88',stroke:SH,'stroke-width':.8},g);
})();
// ---- entrance paths: dashed link from each tile to the nearest road; follows tiles while dragging ----
const ROADW=ROADS.map(r=>r[1].map(p=>[p[0]*K,p[1]*K]));
function nearest(x,y){let best=null;for(const pts of ROADW)for(let i=0;i<pts.length-1;i++){const ax=pts[i][0],ay=pts[i][1],bx=pts[i+1][0],by=pts[i+1][1],dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
 let t=L?((x-ax)*dx+(y-ay)*dy)/L:0;t=Math.max(0,Math.min(1,t));const qx=ax+t*dx,qy=ay+t*dy,d=Math.hypot(x-qx,y-qy);if(!best||d<best.d)best={d,x:qx,y:qy}}return best}
const spg=document.getElementById('spurs');
function spurs(){let d='',pt='',dd='';B.forEach(b=>{if(b.y>1120||b.nospur)return;const n=nearest(b.x,b.y);if(n.d<10)return;
  const ux=(b.x-n.x)/n.d,uy=(b.y-n.y)/n.d,f=v=>v.toFixed(1);
  d+=`M${b.x} ${b.y}L${f(n.x)} ${f(n.y)}`;pt+=`M${f(n.x)} ${f(n.y)}L${f(n.x+ux*9)} ${f(n.y+uy*9)}`;dd+=`M${b.x} ${b.y}L${f(n.x+ux*7)} ${f(n.y+uy*7)}`});
  // SPP order: 4 layers, joint patch, dashes
  SPP.forEach((e,i)=>e.setAttribute('d',i<4?d:i===4?pt:dd))}
const loc={},imgs=id=>[...(IMAGES[id]||[]),...(loc[id]||[])];
function render(){
 tiles.innerHTML='';
 B.forEach(b=>{
  const d=document.createElement('div'),l=imgs(b.id);d.className='b '+b.c;
  d.style.left=b.x+'px';d.style.top=b.y+'px';d.style.width=(b.w||64)+'px';d.style.height=(b.h||36)+'px';d.style.fontSize=(b.s||11)+'px';d.textContent=b.t||b.n;
  if(l[0]){d.classList.add('ph');d.style.backgroundImage=`url(${l[0].src})`;if(!b.photo){d.style.width=(b.pw||PW)+'px';d.style.height=(b.ph||PH)+'px'}d.textContent='';const sp=document.createElement('span');sp.className='lbl';sp.textContent=b.t||b.n;d.appendChild(sp)}
  else if(l.length){const k=document.createElement('i');k.textContent=l.length;d.appendChild(k)}
  if(b.y>1120)d.classList.add('tray');d.dataset.id=b.id;tiles.appendChild(d);
 });
 spurs();
}
render();
legend.innerHTML='<b>Map key</b><div class="cats">'+Object.keys(CATS).map(k=>`<span style="--c:${COL[k]}">${CATS[k]}</span>`).join('')+'</div>'
 +'<div class="lines"><span><svg width="30" height="12"><line x1="1" y1="6" x2="29" y2="6" stroke="#cdd1d4" stroke-width="11" stroke-linecap="round"/><line x1="1" y1="6" x2="29" y2="6" stroke="#72787e" stroke-width="9.8" stroke-linecap="round"/><line x1="1" y1="6" x2="29" y2="6" stroke="#f2f2f2" stroke-width="8.4" stroke-linecap="round"/><line x1="1" y1="6" x2="29" y2="6" stroke="#72787e" stroke-width="7.4" stroke-linecap="round"/><line x1="2" y1="6" x2="28" y2="6" stroke="#f2f2f2" stroke-width="1" stroke-dasharray="6 9"/></svg>Road</span>'
 +'<span><svg width="30" height="12"><line x1="1" y1="6" x2="29" y2="6" stroke="#cdd1d4" stroke-width="8" stroke-linecap="round"/><line x1="1" y1="6" x2="29" y2="6" stroke="#72787e" stroke-width="7" stroke-linecap="round"/><line x1="1" y1="6" x2="29" y2="6" stroke="#f2f2f2" stroke-width="6" stroke-linecap="round"/><line x1="1" y1="6" x2="29" y2="6" stroke="#72787e" stroke-width="5.2" stroke-linecap="round"/><line x1="2" y1="6" x2="28" y2="6" stroke="#f2f2f2" stroke-width="0.8" stroke-dasharray="5 9"/></svg>Lane</span>'
 +'<span><svg width="30" height="12"><line x1="1" y1="6" x2="29" y2="6" stroke="#cdd1d4" stroke-width="6" stroke-linecap="round"/><line x1="1" y1="6" x2="29" y2="6" stroke="#72787e" stroke-width="4.6" stroke-linecap="round"/><line x1="2" y1="6" x2="28" y2="6" stroke="#f2f2f2" stroke-width="1" stroke-dasharray="5 9"/></svg>Entrance path</span>'
 +'</div>'
 +'<small>Schematic map traced from satellite imagery — not to scale.</small>';
let S=1,X=0,Y=0,moved=0,drag=null,edit=false;
const apply=()=>world.style.transform=`translate(${X}px,${Y}px) scale(${S})`;
let H=1120;
function fit(){S=Math.max(.25,Math.min(innerWidth/1964,innerHeight/H));if(innerWidth<700)S=Math.max(S,.5);X=(innerWidth-1964*S)/2;Y=(innerHeight-H*S)/2;if(innerWidth<700){X=0;Y=0}apply()}
function zoomAt(f,cx,cy){const n=Math.min(4,Math.max(.2,S*f));X=cx-(cx-X)*(n/S);Y=cy-(cy-Y)*(n/S);S=n;apply()}
fit();addEventListener('resize',fit);
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
vp.addEventListener('pointerdown',e=>{moved=0;const t=e.target.closest('.b');
 if(edit&&t){const b=B.find(q=>q.id===t.dataset.id);drag={t,b,x:e.clientX,y:e.clientY,ox:b.x,oy:b.y}}
 else drag={x:e.clientX,y:e.clientY,X,Y}});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(Math.abs(dx)+Math.abs(dy)>4)moved=1;if(!moved)return;
 if(drag.b){drag.b.x=drag.ox+Math.round(dx/S);drag.b.y=drag.oy+Math.round(dy/S);drag.t.style.left=drag.b.x+'px';drag.t.style.top=drag.b.y+'px';spurs()}
 else{vp.classList.add('drag');X=drag.X+dx;Y=drag.Y+dy;apply()}});
addEventListener('pointerup',e=>{const d=drag;drag=null;vp.classList.remove('drag');
 if(d&&d.b&&moved){out.value=JSON.stringify(B.map(b=>({id:b.id,x:b.x,y:b.y})));return}
 if(!moved&&!edit){const t=e.target.closest('.b');if(t)open(t.dataset.id)}});
function toggleSat(){document.body.classList.toggle('sat')}
function toggleEdit(){edit=!edit;document.body.classList.toggle('edit',edit);H=edit?1288:1120;fit();out.value=JSON.stringify(B.map(b=>({id:b.id,x:b.x,y:b.y})))}
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;const k=e.key.toLowerCase();if(k==='s')toggleSat();else if(k==='e')toggleEdit();else if(k==='0')fit();else if(k==='+'||k==='=')zoomAt(1.3,innerWidth/2,innerHeight/2);else if(k==='-')zoomAt(.77,innerWidth/2,innerHeight/2)});
// pinch-to-zoom on touch screens
let pin=null;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
vp.addEventListener('touchstart',e=>{if(e.touches.length===2){drag=null;pin=dist(e.touches)}},{passive:true});
vp.addEventListener('touchmove',e=>{if(e.touches.length===2&&pin){const d=dist(e.touches);zoomAt(d/pin,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);pin=d}},{passive:true});
vp.addEventListener('touchend',()=>{pin=null});
let cur=null,idx=0;
function show(){const b=B.find(x=>x.id===cur),l=imgs(cur);
 mc.textContent=CATS[b.c];mt.textContent=b.n;
 gal.innerHTML=l.length?`<img src="${l[idx].src}" alt="${b.n}">`:'No photos yet — memories coming soon.';
 cap.textContent=(l.length?(l[idx].cap||''):(DESC[cur]||''))+(b.apx?'\n'+(b.y>1120?'Location not confirmed: ':'Approximate position: ')+b.apx:'');
 pv.style.display=nx.style.display=l.length>1?'':'none'}
function open(id){cur=id;idx=0;show();modal.classList.add('on')}
pv.onclick=()=>{const n=imgs(cur).length;idx=(idx-1+n)%n;show()};
nx.onclick=()=>{idx=(idx+1)%imgs(cur).length;show()};
cl.onclick=()=>modal.classList.remove('on');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};
up.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{(loc[cur]=loc[cur]||[]).push({src:r.result,cap:f.name});idx=imgs(cur).length-1;show();render()};r.readAsDataURL(f);up.value=''};
</script></body></html>
